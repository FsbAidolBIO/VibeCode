name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python vibecode.py --version
          python vibecode.py analyze . --ascii --top 3
          python vibecode.py vibe-check . --json > /dev/null
          python vibecode.py banner "CI OK"
          python vibecode.py stats
          echo '{"a":1}' | python vibecode.py json --validate
          python vibecode.py b64 encode "hello" | python vibecode.py b64 decode
          python vibecode.py passgen --length 16
          python vibecode.py dashboard . --once
          python vibecode.py banner "NEON" --rainbow | head -c 200
          python vibecode.py lorem --words 10
          python vibecode.py uuid --count 2
          echo "hello ci" | python vibecode.py hash --algo sha256
          export VIBECODE_HOME=$(mktemp -d) && python vibecode.py todo add "ship v1.1.0" && python vibecode.py todo list && python vibecode.py todo done 1
          python vibecode.py git-stats . --authors 3
          mkdir -p /tmp/fixdemo && python vibecode.py vibe-check /tmp/fixdemo --fix --yes && ls /tmp/fixdemo
          python -m http.server 8899 --bind 127.0.0.1 >/dev/null 2>&1 & echo $! > /tmp/srv.pid; sleep 1; python vibecode.py http http://127.0.0.1:8899/ --no-body; kill $(cat /tmp/srv.pid)
          python vibecode.py banner "MINI" --font mini
          python vibecode.py completions bash | grep -q "_vibecode_complete"
          python vibecode.py completions zsh | grep -q "#compdef vibecode"
          python vibecode.py completions fish | grep -q "fish_use_subcommand"
      - name: Dogfood — repo must pass its own vibe-check
        run: |
          python vibecode.py vibe-check . --json | python -c "import json,sys; d=json.load(sys.stdin); print(f\"vibe score: {d['score']}/100 ({d['tier']})\"); sys.exit(0 if d['score'] >= 80 else 1)"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check embedded JS syntax
        run: |
          python3 -c "
          import re
          html = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'no inline <script> found'
          open('/tmp/app.js', 'w', encoding='utf-8').write('\n'.join(scripts))
          print(f'extracted {len(scripts)} script block(s)')
          "
          node --check /tmp/app.js && echo "JS syntax OK"
