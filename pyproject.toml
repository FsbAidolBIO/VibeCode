[project]
name = "vibecode"
version = "1.0.0"
description = "Zero-dependency developer toolkit: terminal CLI + single-file web playground"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["cli", "developer-tools", "tui", "playground"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

[project.scripts]
vibecode = "vibecode:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["vibecode"]
