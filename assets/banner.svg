<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="VibeCode banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.5" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#160a24"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="40" r="130" fill="#8b5cf6" opacity="0.18"/>
  <circle cx="120" cy="290" r="150" fill="#0ea5e9" opacity="0.16"/>
  <circle cx="620" cy="330" r="120" fill="#ec4899" opacity="0.12"/>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" fill="#33456f" font-size="22">
    <text x="70" y="70">&lt;vibe&gt;</text>
    <text x="985" y="70">{ ship }</text>
    <text x="70" y="270">$ sudo touch grass</text>
    <text x="950" y="270">404: stress</text>
  </g>
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="600" y="148" font-size="86" font-weight="800" fill="url(#neon)" filter="url(#glow)">✨ VibeCode</text>
    <text x="600" y="196" font-size="26" fill="#8b96b5">zero-dependency developer toolkit</text>
  </g>
  <rect x="330" y="222" width="540" height="3" rx="1.5" fill="url(#bar)"/>
  <g text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="19" fill="#5b6b8c">
    <text x="600" y="258">cli · playground · pomodoro · visualizer · vibes</text>
  </g>
</svg>
